<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shown for a moment while Firebase checks the saved session -->
  <p id="loading">Checking your session...</p>

  <!-- Hidden at first. JS shows it ONLY when it finds a real user. -->
  <div class="card hidden" id="dashboard">
    <h1>Dashboard</h1>
    <p class="sub">Step 3: a protected page. Only signed-in users can see this.</p>

    <div class="info-row">
      <span class="key">Name</span>
      <span class="value" id="userName">-</span>
    </div>
    <div class="info-row">
      <span class="key">Email</span>
      <span class="value" id="userEmail">-</span>
    </div>
    <div class="info-row">
      <span class="key">User ID</span>
      <span class="value" id="userUid">-</span>
    </div>

    <button class="secondary" id="signoutBtn">Sign Out</button>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
