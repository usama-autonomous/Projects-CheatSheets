<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Create Account</h1>
    <p class="sub">Step 1 of the flow: make a new user</p>

    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" placeholder="Ali Khan">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="at least 6 characters">

    <button id="signupBtn">Sign Up</button>

    <!-- JS writes the error text in here -->
    <p class="message" id="message"></p>

    <p class="link">Already have an account? <a href="signin.html">Sign in</a></p>
  </div>

  <script type="module" src="signup.js"></script>
</body>
</html>
